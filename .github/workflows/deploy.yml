name: Deploy Luxius Panel to GitHub Pages

# ÚNICA fuente de publicación de GitHub Pages (decisión del 19/10/2026).
# Antes coexistían dos mecanismos que se pisaban: este workflow (actions/deploy-pages)
# y scripts/deploy_gh_pages.ps1 (force-push a la rama gh-pages). El workflow
# corría en cada push y sobrescribía lo que el script publicaba, así que los
# commits de gh-pages "tenían éxito" mientras la web seguía sirviendo un build viejo.
#
# REGLA: no volver a publicar en gh-pages por fuera de este workflow. El script
# deploy_gh_pages.ps1 ahora solo VERIFICA que lo publicado corresponda al commit.
on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Cancelar el deploy anterior si llega un push más nuevo: evita que dos builds
  # se peleen por publicar y que quede el más viejo servido.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for case-sensitivity collisions
        run: |
          dupes=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Case-sensitivity collision detected in git index!"
            echo "The following paths have duplicates differing only by casing:"
            echo "$dupes"
            echo ""
            echo "This causes silent failures on Windows (NTFS)."
            echo "Fix: git update-index --force-remove <wrong-case-path>"
            exit 1
          fi
          echo "No case collisions found."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS. Antes era 20, pero jsdom 30 exige >=22.22.2 y hacia
          # fallar el paso Test en cada run (los ultimos 400+ runs del workflow
          # estaban en rojo por esto, sin que nadie lo notara porque el
          # deploy seguia publicandose por el otro mecanismo).
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        # Bloquea el deploy si `tsc` encuentra errores. Antes esto no corria:
        # `vite build` no type-chequea, asi que los errores llegaban a produccion.
        run: npm run typecheck

      - name: Lint
        # ESLint sale con codigo != 0 solo si hay errores; los warnings
        # (react-hooks/exhaustive-deps) no bloquean el deploy.
        run: npm run lint

      - name: Test
        # Cubre la logica pura: motor de nesting y calculo de precios, donde
        # un error silencioso significa cotizar mal o romper la regla de bobina.
        run: npm run test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

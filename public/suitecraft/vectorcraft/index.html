<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VectorCraft">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#262626">
  <title>VectorCraft</title>
  
<script type="module">
import init, * as bindings from './vectorcraft-web-fd27ad12f2de614d.js';
const wasm = await init({ module_or_path: './vectorcraft-web-fd27ad12f2de614d_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    /* iPad: no page scroll, bounce, pinch zoom, text selection or callout; the app takes the gestures. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    /* Inside the safe areas (notch, home indicator) of a full-screen app. */
    #vectorcraft_canvas { position: absolute; top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0); left: env(safe-area-inset-left, 0);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; touch-action: none; }
    #vectorcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./vectorcraft-web-fd27ad12f2de614d.js" crossorigin="anonymous" integrity="sha384-emp9yC0tAPiEpGltGS0DCx51FOJXvLSVCTCEc+VwOYArATUQR6f26/NVXIBR3H/q"><link rel="preload" href="./vectorcraft-web-fd27ad12f2de614d_bg.wasm" crossorigin="anonymous" integrity="sha384-qc3LcEnzYQuw5nuD0vAHolndyXjRaOqiWZ0ksDoF6rMWnhScJ8ff5ZqI/zW00ego" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading">Loading VectorCraft&hellip;</div>

  <script>
  (function() {
    const CANVAS_ID = 'vectorcraft_canvas';
    const LOADING_ID = 'vectorcraft_loading';
    let isAppReady = false;
    let pendingFile = null;
    let lastDelivered = null;

    function dispatchDrop(file) {
      if (!file) return false;
      const canvas = document.getElementById(CANVAS_ID) || document.querySelector('canvas');
      if (!canvas) return false;

      const fileKey = file.name + ':' + file.size;
      if (lastDelivered === fileKey) return true;

      const dt = new DataTransfer();
      dt.items.add(file);

      const pos = {
        bubbles: true,
        cancelable: true,
        dataTransfer: dt,
        clientX: window.innerWidth / 2,
        clientY: window.innerHeight / 2
      };

      try {
        const dragEnter = new DragEvent('dragenter', pos);
        const dragOver = new DragEvent('dragover', pos);
        const drop = new DragEvent('drop', pos);

        window.dispatchEvent(dragEnter);
        canvas.dispatchEvent(dragEnter);
        window.dispatchEvent(dragOver);
        canvas.dispatchEvent(dragOver);
        canvas.dispatchEvent(drop);
        window.dispatchEvent(drop);
        lastDelivered = fileKey;
        console.log('[SuiteCraft:VectorCraft] Archivo entregado exitosamente al lienzo:', file.name, file.size + 'B');
        return true;
      } catch (err) {
        console.error('[SuiteCraft:VectorCraft] Error despachando drop:', err);
        return false;
      }
    }

    function onAppReady() {
      isAppReady = true;
      if (pendingFile) {
        const f = pendingFile;
        pendingFile = null;
        setTimeout(() => dispatchDrop(f), 350);
      }
    }

    function queueFile(file) {
      if (isAppReady) {
        setTimeout(() => dispatchDrop(file), 250);
      } else {
        pendingFile = file;
      }
    }

    window.addEventListener('TrunkApplicationStarted', () => {
      const checkInterval = setInterval(() => {
        const loading = document.getElementById(LOADING_ID);
        const canvas = document.getElementById(CANVAS_ID) || document.querySelector('canvas');
        const isGone = !loading || !document.body.contains(loading) || loading.style.display === 'none';
        if (isGone && canvas) {
          clearInterval(checkInterval);
          setTimeout(onAppReady, 300);
        }
      }, 120);

      setTimeout(() => {
        clearInterval(checkInterval);
        if (!isAppReady) onAppReady();
      }, 15000);
    });

    async function loadUrl(url, fallbackName) {
      if (!url) return;
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const fileName = fallbackName || url.split('/').pop()?.split('?')[0] || 'diseno.svg';
        const file = new File([blob], fileName, { type: blob.type || 'image/svg+xml' });
        queueFile(file);
      } catch (err) {
        console.warn('[SuiteCraft:VectorCraft] No se pudo descargar la imagen por fetch:', err);
      }
    }

    try {
      if (window.location.hash && window.location.hash.length > 1) {
        const raw = decodeURIComponent(window.location.hash.slice(1));
        let targetUrl = null;
        try {
          const json = JSON.parse(raw);
          if (json.files && json.files.length > 0) targetUrl = json.files[0];
        } catch (_) {
          if (/^(https?|data|blob):/i.test(raw)) targetUrl = raw;
        }
        if (targetUrl) {
          loadUrl(targetUrl);
        }
      }
    } catch (err) {
      console.warn('[SuiteCraft:VectorCraft] Error leyendo hash inicial:', err);
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'SUITECRAFT_LOAD_BUFFER' && data.buffer) {
        try {
          const blob = new Blob([data.buffer], { type: data.mimeType || 'image/svg+xml' });
          const file = new File([blob], data.fileName || 'diseno.svg', { type: blob.type });
          queueFile(file);
        } catch (err) {
          console.error('[SuiteCraft:VectorCraft] Error procesando buffer de postMessage:', err);
        }
      } else if (data.type === 'SUITECRAFT_LOAD_FILE' && data.fileUrl) {
        loadUrl(data.fileUrl, data.fileName);
      }
    });
  })();
  </script>
</body>
</html>

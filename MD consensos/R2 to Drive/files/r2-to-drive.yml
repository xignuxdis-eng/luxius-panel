name: Sync R2 to Drive (Purga y Migración)

on:
  schedule:
    # Cada 3 días a las 06:00 UTC = 03:00 ART (Argentina, UTC-3)
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo dry-run (no borra nada de R2)'
        required: false
        type: boolean
        default: false

jobs:
  sync-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install boto3 google-api-python-client google-auth google-auth-oauthlib psycopg2-binary python-dotenv
          # Si el repo tiene requirements.txt, usar ese en su lugar:
          # pip install -r requirements.txt

      - name: Ejecutar sync_r2_to_drive.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIAS_ANTIGUEDAD: '3'
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          python scripts/sync_r2_to_drive.py

      - name: Subir log como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-log-${{ github.run_number }}
          path: r2_migration.log
          retention-days: 30

      - name: Notificar si falló
        if: failure()
        run: |
          echo "::error::La migración R2→Drive falló. Revisar el log en Artifacts de este run."
